<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WC Custom Installments — settings preview</title>
    <link rel="stylesheet" href="./app/dist/styles/bootstrap.css" />
    <style>
      /* Stand in for the WordPress admin frame the screen normally sits inside. */
      body {
        margin: 0;
        background: #f4f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .preview-frame {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.5rem 6rem;
      }

      .preview-note {
        margin-bottom: 1.5rem;
        border-radius: 0.75rem;
        background: #102033;
        color: #fff;
        padding: 0.75rem 1rem;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="preview-frame">
      <p class="preview-note">
        Static harness. The bootstrap payload is the real one, dumped from PHP; writes are stubbed.
      </p>

      <div id="wc-custom-installments-settings-app">
        <div class="wcci-skeleton" style="height: 96px"></div>
      </div>
    </div>

    <script>
      /**
       * Stand in for WordPress: the localized bootstrap config, the i18n runtime,
       * and a fetch that answers the plugin's own endpoints from a fixture.
       */
      window.wcCustomInstallmentsBootstrap = {
        restUrl: '/preview-api',
        nonce: 'preview',
        page: 'settings',
        endpoint: 'admin/settings',
      };

      window.wp = {
        i18n: {
          __: (text) => text,
          _n: (single, plural, number) => (number === 1 ? single : plural),
          sprintf: (message, ...args) => {
            let index = 0;

            return String(message).replace(/%[ds]/g, () => args[index++]);
          },
        },
      };

      const realFetch = window.fetch.bind(window);

      window.fetch = async (input, init) => {
        const url = String(input);

        if (url.includes('/preview-api/admin/settings/export')) {
          const response = await realFetch('./preview-bootstrap.json');
          const payload = await response.json();

          return new Response(
            JSON.stringify({
              signature: 'wc-custom-installments-settings',
              version: '1.0.0',
              settings: payload.settings,
            }),
            { status: 200, headers: { 'Content-Type': 'application/json' } },
          );
        }

        if (url.includes('/preview-api/admin/settings')) {
          const method = (init && init.method) || 'GET';

          if (method === 'GET') {
            return realFetch('./preview-bootstrap.json');
          }

          const body = init && init.body ? JSON.parse(init.body) : {};

          return new Response(
            JSON.stringify({
              status: 'success',
              message: 'Settings saved.',
              settings: body.settings || {},
            }),
            { status: 200, headers: { 'Content-Type': 'application/json' } },
          );
        }

        return realFetch(input, init);
      };
    </script>

    <script>
      /**
       * Load the bundle fresh on every visit.
       *
       * Vite emits a fixed file name and WordPress versions it by mtime; there
       * is no such mechanism here, and a cached module makes a rebuilt bundle
       * look like it changed nothing.
       */
      const moduleTag = document.createElement('script');

      moduleTag.type = 'module';
      moduleTag.src = `./app/dist/settings/app.js?t=${Date.now()}`;
      document.body.appendChild(moduleTag);
    </script>
  </body>
</html>
